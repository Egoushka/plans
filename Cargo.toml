[package]
name = "checked-plans"
version = "0.1.0"
edition = "2021"
description = "Checked plans: an agent plan declares its tools, costs and budgets, and a checker proves the bounds before it runs"
license = "MIT"
repository = "https://github.com/Egoushka/plans"
keywords = ["agents", "static-analysis", "budget", "dsl", "verification"]
categories = ["development-tools", "compilers"]

[lib]
name = "checked_plans"
path = "src/lib.rs"

[[bin]]
name = "plans"
path = "src/main.rs"
